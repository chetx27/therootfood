<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="TheRootFood logo" fill="none">
  <!-- Soft glass disc -->
  <circle cx="64" cy="64" r="58" fill="#2D5C42"/>
  <circle cx="64" cy="64" r="58" fill="url(#glow)" opacity="0.35"/>
  <circle cx="64" cy="64" r="58" stroke="#E8B4C8" stroke-width="3"/>

  <!-- Root / sprout mark -->
  <path d="M64 92 V48" stroke="#FAF7F0" stroke-width="5" stroke-linecap="round"/>
  <path d="M64 70 C48 70 40 58 38 44" stroke="#FAF7F0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M64 62 C78 62 86 52 88 40" stroke="#FAF7F0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Leaf tips -->
  <ellipse cx="36" cy="40" rx="10" ry="7" transform="rotate(-28 36 40)" fill="#E8B4C8"/>
  <ellipse cx="90" cy="36" rx="10" ry="7" transform="rotate(30 90 36)" fill="#E8B4C8"/>
  <!-- Soil accent -->
  <path d="M48 96 C54 102 74 102 80 96" stroke="#E8B4C8" stroke-width="3.5" stroke-linecap="round"/>

  <defs>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#2D5C42" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
